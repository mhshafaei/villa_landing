<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ویلای دوبلکس شالیزار | آرامش روستا، آسایش شهر</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    
</header>

<main>
<section id="hero">

    <div class="hero-overlay"></div>

    <div class="hero-content">

        <p class="hero-kicker" id="hero-kicker"></p>

<h1 id="hero-title"></h1>

<p class="hero-description" id="hero-description"></p>

    </div>

    <div class="scroll-down">
        ↓
    </div>

</section>
<section id="video-section">

    <div class="container">

        <p class="section-label">
            نمای اطراف ویلا
        </p>

        <h2>
            فقط چند ثانیه نگاه کنید...
        </h2>

        <video
    autoplay
    muted
    loop
    playsinline
    preload="metadata"
    poster="assets/images/hero.jpg">

    <source src="assets/videos/view.mp4" type="video/mp4">

    مرورگر شما از ویدئو پشتیبانی نمی‌کند.

</video>

    </div>

</section>

<section id="gallery">

    <div class="container">

        <p class="section-label">
            گالری تصاویر
        </p>

        <h2>ویلا را از نزدیک ببینید</h2>

        <div id="gallery-grid"></div>

    </div>

</section>

<section id="highlights">

    <div class="container">

        <p class="section-label">
            چرا این ویلا؟
        </p>

        <h2>
            فقط یک ویلا نیست؛ یک سبک زندگی است.
        </h2>

        <div id="highlights-grid"></div>

    </div>

</section>
<section id="cta">

    <div class="container">

        <h2 id="cta-title"></h2>

        <p id="cta-text"></p>

        <div class="cta-buttons">

            <a id="call-btn" class="btn btn-primary">
                تماس
            </a>

            <a id="ble-btn" class="btn btn-secondary">
                بله
            </a>

        </div>

    </div>

</section>

</main>

<footer>

</footer>
<script src="app.js"></script>
</body>
</html>
